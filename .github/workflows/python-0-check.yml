name: Python
on:
  push:
    branches: [master]
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:

  # This workflow will run pytest and lint with a variety of Python versions.
  # https://docs.github.com/en/actions/tutorials/build-and-test-code/python#testing-your-code
  pytest:
    name: Pytest
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
        resolution:
          - highest
          # - lowest
          - lowest-direct

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        run: pip install uv

      - name: Install Package
        run:
          uv pip install
            --system
            --resolution ${{ matrix.resolution }}
            .[dev]

      - name: Test with pytest
        run:
          pytest
            --doctest-modules

  sphinx:
    name: Sphinx
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install uv
        run: pip install uv

      - name: Install Package
        run:
          uv pip install
            --system
            .[dev]

      - name: Build Sphinx Documentation
        run:
          sphinx-build -M html docs/ dist/
