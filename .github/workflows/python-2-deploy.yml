name: Python Deploy
on:
  push:
    tags: ["v*"]
  # Because GitHub's own push actions can't trigger flows themselves,
  # we have to trigger the flow manually.
  # https://stackoverflow.com/a/73974083/1062668
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  info:
    name: Determine Deployment Info
    runs-on: ubuntu-latest

    outputs:
      tagname: ${{ steps.info.outputs.tagname }}
      version: ${{ steps.info.outputs.version }}

    steps:
      - name: Determine tag and version info
        id: info
        run: |
          TAGNAME=${GITHUB_REF_NAME}
          VERSION=${TAGNAME:1}

          echo "tagname=${TAGNAME}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

  build:
    name: Build Python Package
    runs-on: ubuntu-latest
    needs: [info]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install uv
        run: pip install uv

      - name: Build Package
        env:
          PACKAGE_VERSION: ${{ needs.info.outputs.version }}
        run: uv build

      - name: Upload Tarball (Source) Distribution
        uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

      - name: Upload Wheel Distribution
        uses: actions/upload-artifact@v4
        with:
          name: wheel
          path: dist/*.whl

  docs:
    name: Build Documentation
    runs-on: ubuntu-latest
    needs: [info]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install uv
        run: pip install uv

      - name: Install Package
        run:
          uv pip install
            --system
            .[dev]

      - name: Build Sphinx Documentation
        env:
          PACKAGE_VERSION: ${{ needs.info.outputs.version }}
        run: |
          sphinx-build -M html docs/ dist/
          tar -C dist/ -cvzf dist/docs-$PACKAGE_VERSION.tar.gz doctrees html

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: docs
          path: dist/*.tar.gz

  publish-github:
    name: Publish Distribution as Github Release
    runs-on: ubuntu-latest
    needs: [info, build, docs]
    steps:
      - uses: actions/checkout@v5

      - name: Retrieve Tarball (Source) Distribution
        uses: actions/download-artifact@v5
        with:
          name: sdist
          path: dist/

      - name: Retrieve Wheel Distribution
        uses: actions/download-artifact@v5
        with:
          name: wheel
          path: dist/

      - name: Retrieve Documentation
        uses: actions/download-artifact@v5
        with:
          name: docs
          path: dist/

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.info.outputs.tagname }}
          files: |
            dist/*

  # This workflow will build the python package, and publish it to PyPI.
  # https://docs.github.com/en/actions/tutorials/build-and-test-code/python#publishing-to-pypi
  publish-pypi:
    name: Publish Distribution
    runs-on: ubuntu-latest
    needs: [build]

    permissions:
      # IMPORTANT: this permission is mandatory for trusted publishing
      id-token: write

    # Dedicated environments with protections for publishing are strongly recommended.
    environment:
      name: pypi

    steps:
      - name: Retrieve Tarball (Source) Distribution
        uses: actions/download-artifact@v5
        with:
          name: sdist
          path: dist/

      - name: Retrieve Wheel Distribution
        uses: actions/download-artifact@v5
        with:
          name: wheel
          path: dist/

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
