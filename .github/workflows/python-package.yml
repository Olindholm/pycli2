# This workflow will build the python package, and publish it to PyPI.
# https://docs.github.com/en/actions/tutorials/build-and-test-code/python#publishing-to-pypi

name: Python Publish
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: Build Distribution
    # if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    outputs:
      tagname: ${{ steps.info.outputs.tagname }}
      version: ${{ steps.info.outputs.version }}

    steps:
      - name: Determine tag and version info
        id: info
        run: |
          TAGNAME=${GITHUB_REF_NAME}
          VERSION=${TAGNAME:1}

          echo "tagname=${TAGNAME}" >> "$GITHUB_OUTPUT"
          echo "message=${MESSAGE}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install uv
        run: pip install uv

      - name: Build Package
        env:
          PACKAGE_VERSION: ${{ steps.info.outputs.version }}
        run: uv build

      - name: Upload Tarball (Source) Distribution
        uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

      - name: Upload Wheel Distribution
        uses: actions/upload-artifact@v4
        with:
          name: wheel
          path: dist/*.whl

  publish-github:
    name: Publish Distribution as Github Release
    runs-on: ubuntu-latest
    needs:
      - build
    steps:
      - uses: actions/checkout@v5

      - name: Retrieve Tarball (Source) Distribution
        uses: actions/download-artifact@v5
        with:
          name: sdist
          path: dist/

      - name: Retrieve Wheel Distribution
        uses: actions/download-artifact@v5
        with:
          name: wheel
          path: dist/

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build.outputs.tagname }}
          files: |
            dist/*

  publish-pypi:
    name: Publish Distribution
    runs-on: ubuntu-latest
    needs:
      - build

    permissions:
      # IMPORTANT: this permission is mandatory for trusted publishing
      id-token: write

    # Dedicated environments with protections for publishing are strongly recommended.
    environment:
      name: pypi

    steps:
      - name: Retrieve Tarball (Source) Distribution
        uses: actions/download-artifact@v5
        with:
          name: sdist
          path: dist/

      - name: Retrieve Wheel Distribution
        uses: actions/download-artifact@v5
        with:
          name: wheel
          path: dist/

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
